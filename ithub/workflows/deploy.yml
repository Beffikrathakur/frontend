name: Auto Build Check
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-node: '20'
    - name: Install and Test Build
      run: |
        npm install
        npm run build --if-present
